<!DOCTYPE html>

<html>

<head>
    <title>Edit Task</title>
</head>

<body>

    <h1>Edit Task</h1>

    <h2>{{ task.title }}</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{% url 'project_workspace' task.project.id %}">
        Cancel
    </a>

</body>

</html>
