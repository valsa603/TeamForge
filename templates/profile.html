<!DOCTYPE html>
<html>

<head>
    <title>TeamForge - My Profile</title>
</head>

<body>

    <h1>My Profile</h1>

    <p>
        Username: {{ user.username }}
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Profile
        </button>

    </form>

    <br>

    <a href="{% url 'dashboard' %}">
        Back to Dashboard
    </a>

</body>

</html>
