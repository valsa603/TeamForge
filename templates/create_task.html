<!DOCTYPE html>

<html>

<head>

    <title>TeamForge - Create Task</title>

</head>

<body>

    <h1>Create Task</h1>

    <h2>{{ project.title }}</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Task
        </button>

    </form>

    <br>

    <a href="{% url 'project_workspace' project.id %}">
        Back to Workspace
    </a>

</body>

</html>
