{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TeamForge - Dashboard</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="dashboard">

        <h1>Welcome to TeamForge!</h1>

        <h2>Hello, {{ user.username }} 👋</h2>

        <p>This is your project dashboard.</p>

        <div class="nav-links">

            <a href="{% url 'profile' %}">
                My Profile
            </a>

            <a href="{% url 'create_project' %}">
                Create Project
            </a>

            <a href="{% url 'project_list' %}">
                My Projects
            </a>

            <a href="{% url 'my_tasks' %}">
                My Tasks
            </a>

            <a href="{% url 'invitations' %}">
                Team Invitations
            </a>

            <a href="{% url 'logout' %}" class="logout">
                Logout
            </a>

        </div>

    </div>

</body>
</html>
