<!DOCTYPE html>

<html>

<head>

    <title>TeamForge - Notifications</title>

</head>

<body>

    <h1>Notifications</h1>

    {% if notifications %}

        {% for notification in notifications %}

            <div>

                <p>
                    {{ notification.message }}
                </p>

                <small>
                    {{ notification.created_at }}
                </small>

                <hr>

            </div>

        {% endfor %}

    {% else %}

        <p>
            You have no notifications.
        </p>

    {% endif %}

    <br>

    <a href="{% url 'dashboard' %}">
        Back to Dashboard
    </a>

</body>

</html>
